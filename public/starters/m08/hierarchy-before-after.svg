      <text x="74" y="1110" font-size="14" fill="#1f1f1f">Reserve a place stays the only filled button, because this screen exists so a person can decide and book.</text>
      <text x="74" y="1130" font-size="14" fill="#1f1f1f">Add to shortlist becomes a quiet text action: in the paper test, one of five people pressed it believing she</text>
      <text x="74" y="1150" font-size="14" fill="#1f1f1f">had booked, when both buttons were filled and equal.</text>
