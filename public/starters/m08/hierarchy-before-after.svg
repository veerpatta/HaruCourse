      <text x="74" y="1178" font-size="14" fill="#1f1f1f">6 of 8 places left. Before: small, light grey text. After: body size and semibold, under the price, because</text>
      <text x="74" y="1198" font-size="14" fill="#1f1f1f">two of the five paper-test participants looked for it before reading anything else.</text>
    </g>
    <g id="legend-4">
