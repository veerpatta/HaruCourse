<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1400" viewBox="0 0 900 1400" role="img" aria-labelledby="figure-title figure-desc">
  <title id="figure-title">Same screen, two rankings: before and after (HaruCourse Module 8 practice figure, made up)</title>
  <desc id="figure-desc">A made-up practice figure for HaruCourse Module 8, lesson 3. Two versions of the same phone booking screen sit side by side, with numbered callouts. The ranking changed because of this screen's task and the made-up research notes, not because of a general rule such as "the main button should always be biggest". Callout 1, Share with a friend: before, a small icon in the corner, drawn on the assumption that sharing is rarely used; after, an outlined button under Reserve, because 3 of 4 interviewees and the one observed participant checked the plan with someone else before paying. Callout 2, Reserve a place stays the only filled button because this screen exists so a person can decide and book; Add to shortlist becomes a quiet text action, because in the paper test one of five people pressed it believing she had booked when both buttons were filled and equal. Callout 3, 6 of 8 places left: before, small light grey text; after, body size and semibold under the price, because two of the five paper-test participants looked for it before reading anything else. Callout 4, What to bring: before, hidden behind More details below the buttons; after, a short list above them, because 7 of 11 public reviews of local class providers mentioned not knowing what to bring. Callout 5, a second defensible layout (B): Share beside the price, next to the details a friend would need; neither layout is proven, and to choose you would ask people to check the class with a friend and then book it, and watch which they find. What would change the ranking: notes showing that people book alone, like the fourth interviewee, would make a quiet share link defensible. Everything here is made up for practice; it is not research and not a real studio. The figure is greyscale, so every difference shown is carried by weight, size, containment and position rather than colour.</desc>

